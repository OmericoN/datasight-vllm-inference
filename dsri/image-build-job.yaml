apiVersion: batch/v1
kind: Job
metadata:
  name: datasight-image-build
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: builder
      restartPolicy: Never
      containers:
        - name: image-build
          image: gcr.io/go-containerregistry/crane/debug:v0.22.1
          command: ["/busybox/sh", "/source/build-image.sh"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: datasight-image-source
