apiVersion: batch/v1
kind: Job
metadata:
  name: datasight-model-download
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: anyuid
      restartPolicy: Never
      containers:
        - name: download
          image: image-registry.openshift-image-registry.svc:5000/ub-ub-datasight/datasight-vllm-gpu:qwen3.8-27b-v1
          imagePullPolicy: IfNotPresent
          env:
            - name: VLLM_MODEL
              value: Qwen/Qwen3.8-27B
            - name: VLLM_REVISION
              value: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
            - name: VLLM_START_MODE
              value: download
            - name: HF_HOME
              value: /hf-cache
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 8Gi
              ephemeral-storage: 10Gi
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: pvc-datasight-hf-cache
