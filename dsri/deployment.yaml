apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasight-vllm-gpu
  labels:
    app: datasight-vllm-gpu
spec:
  replicas: 0
  strategy:
    type: Recreate
  progressDeadlineSeconds: 2400
  selector:
    matchLabels:
      app: datasight-vllm-gpu
  template:
    metadata:
      labels:
        app: datasight-vllm-gpu
    spec:
      serviceAccountName: anyuid
      containers:
        - name: vllm
          image: image-registry.openshift-image-registry.svc:5000/ub-ub-datasight/datasight-vllm-gpu:qwen3.8-27b-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8000"
            - name: VLLM_MODEL
              value: Qwen/Qwen3.8-27B
            - name: VLLM_REVISION
              value: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
            - name: SERVED_MODEL_NAME
              value: Qwen/Qwen3.8-27B
            - name: VLLM_DTYPE
              value: bfloat16
            - name: VLLM_START_MODE
              value: serve
            - name: HF_HOME
              value: /hf-cache
            - name: HUGGINGFACE_HUB_CACHE
              value: /hf-cache/hub
            - name: TRANSFORMERS_CACHE
              value: /hf-cache/transformers
            - name: XDG_CACHE_HOME
              value: /hf-cache/xdg
            - name: VLLM_CACHE_ROOT
              value: /hf-cache/vllm
            - name: TRITON_CACHE_DIR
              value: /hf-cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /hf-cache/torchinductor
            - name: HOME
              value: /tmp
            - name: USER
              value: datasight
            - name: LOGNAME
              value: datasight
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
              ephemeral-storage: 2Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: pvc-datasight-hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
